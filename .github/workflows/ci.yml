name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned source texts (verified by SHA-256 in scripts/data-manifest.ts).
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: bible-data-${{ hashFiles('scripts/data-manifest.ts') }}

      - name: Fetch and verify source data, build the database
        run: npm run db:setup

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
